<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Ekran dostępu do strony Przedszkola nr 1.">
  <title>Dostęp — Przedszkole nr 1</title>
  <style>
    :root { color-scheme: light; font-family: "Trebuchet MS", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #173958;
      background: #eaf7fb url("assets/illustrations/deco-sun-plants.png") right bottom / min(32vw, 360px) auto no-repeat fixed;
    }
    .gate {
      width: min(100%, 390px);
      padding: 32px;
      background: rgba(255, 255, 255, .96);
      border: 1px solid #d6e9f1;
      border-radius: 20px;
      box-shadow: 0 12px 36px rgba(38, 87, 116, .12);
    }
    h1 { margin: 0 0 8px; font-size: 25px; line-height: 1.2; }
    p { margin: 0 0 24px; color: #56758b; line-height: 1.5; }
    label { display: block; margin-bottom: 7px; font-weight: 700; }
    input, button { width: 100%; min-height: 46px; border-radius: 11px; font: inherit; }
    input { padding: 10px 12px; color: #173958; background: #fff; border: 1px solid #9db9c9; }
    button { margin-top: 12px; padding: 10px 18px; color: #fff; background: #287fa4; border: 0; font-weight: 700; cursor: pointer; }
    button:hover { background: #1d6d8f; }
    input:focus-visible, button:focus-visible { outline: 3px solid #c4414d; outline-offset: 3px; }
    @media (max-width: 500px) {
      body { padding: 16px; background-size: 220px auto; }
      .gate { padding: 26px 22px; }
    }
  </style>
  <script src="js/poc-gate.js" defer></script>
</head>
<body>
  <main class="gate">
    <h1>Dostęp do strony</h1>
    <p>Wpisz hasło, aby przejść dalej.</p>
    <form id="access-form">
      <label for="password">Hasło</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Wejdź</button>
    </form>
  </main>
</body>
</html>
